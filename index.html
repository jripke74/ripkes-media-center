<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Ripke’s Media Center – Your Personal Media Library</title>
  <meta name="description"
    content="Ripke’s Media Center is a personal media library for movies, TV shows, documentaries, music, photos, and home videos. Clean Apple TV-inspired interface with light and dark themes.">
  <meta name="keywords"
    content="media center, movies, TV shows, music, photos, home videos, personal library, Apple TV style">
  <meta name="author" content="Ripke">
  <link rel="canonical"
    href="https://your-app-name.herokuapp.com/">

  <!-- Open Graph / Facebook / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ripke’s Media Center">
  <meta property="og:description"
    content="Your personal media library for movies, TV, music, photos, and more.">
  <meta property="og:image"
    content="https://via.placeholder.com/1200x630/1d1d1f/f5f5f7?text=Ripke’s+Media+Center">
  <meta property="og:url"
    content="https://your-app-name.herokuapp.com/">
  <meta property="og:site_name" content="Ripke’s Media Center">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ripke’s Media Center">
  <meta name="twitter:description"
    content="Your personal media library for movies, TV, music, photos, and more.">
  <meta name="twitter:image"
    content="https://via.placeholder.com/1200x630/1d1d1f/f5f5f7?text=Ripke’s+Media+Center">

  <!-- Theme color (for browser UI / mobile) -->
  <meta name="theme-color" content="#f5f5f7"
    media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000"
    media="(prefers-color-scheme: dark)">
  <title>Ripke’s Media Center</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="header">
    <h1>Ripke’s Media Center</h1>
    <button id="theme-toggle" class="theme-toggle"
      aria-label="Toggle dark mode">
      🌙
    </button>
  </header>

  <main>
    <section class="library">
      <h2>Library</h2>
      <div id="media-grid" class="media-grid"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
