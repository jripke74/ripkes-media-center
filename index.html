<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ripke’s Media Center – Your Personal Media Library</title>
  <meta name="description" content="Ripke’s Media Center is a personal media library for movies, TV shows, documentaries, music, photos, and home videos. Clean Apple TV-inspired interface with light and dark themes.">
  <meta name="author" content="Jeff Ripke">
  <link rel="canonical" href="https://your-app-name.herokuapp.com/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Ripke’s Media Center">
  <meta property="og:description" content="Your personal media library for movies, TV, music, photos, and more.">
  <meta property="og:image" content="https://via.placeholder.com/1200x630/1d1d1f/f5f5f7?text=Ripke’s+Media+Center">
  <meta property="og:url" content="https://your-app-name.herokuapp.com/">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ripke’s Media Center">
  <meta name="twitter:description" content="Your personal media library for movies, TV, music, photos, and more.">
  <meta name="twitter:image" content="https://via.placeholder.com/1200x630/1d1d1f/f5f5f7?text=Ripke’s+Media+Center">

  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <h1 class="logo">Ripke’s Media Center</h1>
    <button id="menu-toggle" class="menu-toggle" aria-label="Menu">☰</button>

    <div class="header-menu" id="header-menu">
      <input type="search" id="search-input" placeholder="Search library…" aria-label="Search library">
      <div id="auth-area">
        <button id="show-login" class="auth-btn">Log in</button>
      </div>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main>
    <div id="library"></div>
  </main>

  <!-- Detail panel -->
  <div id="detail-overlay" class="detail-overlay hidden">
    <div class="detail-panel">
      <button id="detail-close" class="detail-close" aria-label="Close">&times;</button>
      <img id="detail-image" alt="">
      <video id="detail-video" controls style="display: none; width: 100%; border-radius: 12px; margin-bottom: 1rem;"></video>
      <h2 id="detail-title"></h2>
      <p id="detail-type"></p>
      <p id="detail-year"></p>
      <p id="detail-description"></p>
      <button id="detail-play" class="play-button">▶ Play</button>
    </div>
  </div>

  <!-- Auth modal -->
  <div id="auth-overlay" class="detail-overlay hidden">
    <div class="detail-panel">
      <button id="auth-close" class="detail-close" aria-label="Close">&times;</button>
      <h2 id="auth-title">Log in</h2>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" required>
        <input type="password" id="auth-password" placeholder="Password" required>
        <button type="submit" class="play-button">Submit</button>
      </form>
      <p id="auth-toggle-text">
        Need an account? <a href="#" id="toggle-auth-mode">Register</a>
      </p>
      <p id="auth-message"></p>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; <span id="current-year"></span> Jeff Ripke. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
